name: Release packages

# Push a tag to publish: `cli-v0.1.0` releases @modus-ui/cli, `mcp-v0.1.0` releases @modus-ui/mcp.
# The tag version must match the package's package.json version.
# Publishes with npm trusted publishing (OIDC): no token. Each package has a trusted publisher on
# npmjs.com (Settings -> Trusted Publisher) for kasimkazmi/Modus-UI, workflow release.yml.
on:
  push:
    tags: ["cli-v*", "mcp-v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Resolve package from tag
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          dir="packages/${tag%%-v*}"
          version="${tag#*-v}"
          actual=$(node -p "require('./$dir/package.json').version")
          if [ "$version" != "$actual" ]; then
            echo "::error::Tag $tag does not match $dir/package.json version $actual"; exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          # scripts/release.sh may already have published from a maintainer's machine.
          name=$(node -p "require('./$dir/package.json').name")
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm --dir ${{ steps.pkg.outputs.dir }} build
        if: steps.pkg.outputs.published != 'true'
      - run: pnpm --dir ${{ steps.pkg.outputs.dir }} test
        if: steps.pkg.outputs.published != 'true'
      - run: npm publish --provenance --access public
        if: steps.pkg.outputs.published != 'true'
        working-directory: ${{ steps.pkg.outputs.dir }}
